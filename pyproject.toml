[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reqstream"
version = "0.1.0"
description = "Streaming ingestion and ranking over open-requisition data"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Abheesht Roy"}]
keywords = ["jobs", "ats", "hiring", "recruiting", "data-pipeline"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Office/Business",
  "Intended Audience :: Developers",
]
dependencies = []          # ingest / gate / rank are standard library only

[project.optional-dependencies]
# verify needs a Chromium binary on PATH and pdftotext (poppler-utils);
# neither is a Python package, so there is nothing to pin here.
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/abheeshtroy/reqstream"

[project.scripts]
reqstream = "reqstream.cli:main"

[tool.setuptools.packages.find]
include = ["reqstream*"]
